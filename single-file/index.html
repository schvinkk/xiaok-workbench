<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小K万能工作台 · 求职备考 + 计划打卡</title>
<meta name="description" content="全国求职 + 考公考编 + 资格考试 + 考研，一体化个人工作台。数据只存自己浏览器，隐私零上传。">
<meta name="theme-color" content="#4f46e5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小K工作台">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='126' font-size='104' font-family='sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='46' font-size='38' font-family='sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5fb; --bg2:#f7f9fd; --panel:#fff; --panel2:#eef1fb;
  --line:#e7eaf3; --line2:#d9def0;
  --txt:#1f2533; --muted:#6b7385; --muted2:#a6adc2;
  --primary:#4f46e5; --primary2:#6366f1; --primary-d:#3730a3;
  --blue:#2563eb; --sky:#0ea5e9;
  --amber:#f59e0b; --red:#ef4444; --purple:#7c3aed; --green:#16a34a;
  --shadow:0 8px 28px rgba(79,70,229,.10);
  --radius:16px;
  --topbar:rgba(247,249,253,.9);
  --today-bg:linear-gradient(135deg,#fff,#fbfaff);
  --warn-bg:#fff8e6; --warn-line:#f3dfa8; --warn-txt:#8a6300; --warn-btn:#fff;
  --danger-hover:#fff0f0;
  --heat0:#e9edf8; --heat1:#c7d2fe; --heat2:#a5b4fc; --heat3:#818cf8; --heat4:#4f46e5;
  --ok-bg:#e6f6ec;
}
html[data-theme="dark"]{
  --bg:#0e1117; --bg2:#12161f; --panel:#181d28; --panel2:#222836;
  --line:#28303f; --line2:#354055;
  --txt:#e7eaf3; --muted:#9aa3b8; --muted2:#6b7385;
  --primary:#6d64f5; --primary2:#8b83ff; --primary-d:#c7c2ff;
  --blue:#60a5fa; --sky:#38bdf8;
  --amber:#fbbf24; --red:#f87171; --purple:#a78bfa; --green:#4ade80;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  --topbar:rgba(18,22,31,.9);
  --today-bg:linear-gradient(135deg,#1b2130,#191d2b);
  --warn-bg:#2c2410; --warn-line:#5c4a18; --warn-txt:#f5c65a; --warn-btn:#3a3113;
  --danger-hover:#3a1d1d;
  --heat0:#222836; --heat1:#312e81; --heat2:#4338ca; --heat3:#6366f1; --heat4:#a5b4fc;
  --ok-bg:#12331f;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img,svg,canvas{max-width:100%;height:auto}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:18px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--purple));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.brand .t1{font-weight:700;font-size:15px;line-height:1.2}
.brand .t2{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);
  font-size:14px;font-weight:500;margin-bottom:3px;transition:.15s}
.nav a svg{width:19px;height:19px;flex-shrink:0}
.nav a:hover{background:var(--panel2);color:var(--txt)}
.nav a.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:var(--shadow)}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:1px 7px;font-weight:600}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.topbar .sub{font-size:12px;color:var(--muted)}
.topbar-title{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.topbar-title h1,.topbar-title .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.sidebar-toggle{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--txt);flex-shrink:0}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--txt);padding:8px 13px;border-radius:10px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.danger{color:var(--red);border-color:#f3c9c9}
.btn.danger:hover{background:var(--danger-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:active{transform:scale(.97)}
.view{padding:18px;max-width:1180px;width:100%;margin:0 auto}
.backup-tip{max-width:1180px;width:100%;margin:14px auto -4px;padding:10px 14px;border-radius:12px;
  background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-txt);font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.backup-tip .bt-txt{flex:1;min-width:180px;line-height:1.5}
.backup-tip button{border:1px solid var(--warn-line);background:var(--warn-btn);color:var(--warn-txt);padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600}
@media(max-width:768px){.backup-tip{margin:12px 14px -2px;width:auto}}
/* cards */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.panel h3{font-size:14px;margin:0 0 10px;color:var(--muted)}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:5px}
.stat .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
/* today */
.today{background:var(--today-bg);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.today h2{margin:0 0 10px;font-size:15px}
.today .item{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px dashed var(--line)}
.today .item:first-of-type{border-top:none}
.today .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.today .meta{flex:1;min-width:0}
.today .meta b{font-weight:600}
.today .meta small{color:var(--muted);display:block;font-size:12px}
.today .empty{color:var(--muted);font-size:13px;padding:6px 0}
/* badges */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted)}
.tag.blue{background:#e6efff;color:var(--blue)}
.tag.green{background:var(--ok-bg);color:var(--green)}
.tag.amber{background:#fef3df;color:#b76e00}
.tag.red{background:#fdeaea;color:var(--red)}
.tag.purple{background:#f1e9fd;color:var(--purple)}
.pbadge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
/* job cards */
.job{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.job .top{display:flex;gap:10px;align-items:flex-start}
.job .title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .co{color:var(--muted);font-size:13px}
.job .desc{font-size:13px;color:#444;line-height:1.5;max-height:62px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.job .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.job .salary{color:var(--green);font-weight:700;font-size:13px}
.chip{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{border-color:var(--primary);color:var(--primary)}
.iconbtn.on{color:var(--red);border-color:#f3c9c9}
.iconbtn svg{width:17px;height:17px}
/* segmented control */
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.seg-btn{font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;overflow-x:auto}
.kcol{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px;min-width:170px}
.kcol h4{margin:0 0 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.kcol .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel);border-radius:8px;padding:1px 7px}
.kcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mc,#ccc);border-radius:9px;padding:9px;margin-bottom:8px;font-size:13px}
.kcard .t{font-weight:600;line-height:1.35}
.kcard .m{color:var(--muted);font-size:11px;margin-top:4px}
.kcard .acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.minibtn{font-size:11px;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.minibtn:hover{border-color:var(--primary);color:var(--primary)}
/* forms */
label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--txt);
  outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:13px}
.hint{font-size:12px;color:var(--muted2);margin-top:4px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,24,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.overlay.show{display:flex}
.modal{background:var(--panel);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px;animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal h3{margin:0 0 16px;font-size:17px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* table-ish lists */
.listrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.listrow:first-child{border-top:none}
.listrow .body{flex:1;min-width:0}
.listrow .body b{font-weight:600}
.listrow .body small{color:var(--muted);display:block;font-size:12px}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl .ev{position:relative;padding:10px 0}
.tl .ev:before{content:"";position:absolute;left:-22px;top:15px;width:12px;height:12px;border-radius:50%;
  background:var(--panel);border:3px solid var(--primary)}
.tl .ev.done:before{background:var(--green);border-color:var(--green)}
.tl .ev.overdue:before{border-color:var(--red);background:var(--red)}
/* progress ring */
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
/* provinces */
.provtab{display:inline-flex;padding:4px;background:var(--panel2);border-radius:12px;gap:4px;flex-wrap:wrap}
.provtab button{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.provtab button.active{background:var(--panel);color:var(--primary);box-shadow:var(--shadow)}
.ind{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.ind .ih{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ind .name{font-weight:700;font-size:14px}
.ind .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.ind .kv b{color:var(--muted);font-weight:600}
/* misc */
.divider{height:1px;background:var(--line);margin:16px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state svg{width:46px;height:46px;opacity:.4;margin-bottom:10px}
/* 空状态插画（v6）：大图 + 引导文案 + 行动按钮，降低陌生用户门槛 */
.empty-art{text-align:center;padding:34px 20px 30px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-art .art{width:180px;height:132px;margin-bottom:4px;animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty-art .et{font-size:16px;font-weight:700;color:var(--txt);margin-top:2px}
.empty-art .ed{max-width:420px;font-size:13px;line-height:1.6;margin:0 auto 6px}
.empty-art .ebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-txt);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:center}
.locbar{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--primary);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.locbar.neutral{border-left-color:var(--muted);color:var(--muted)}
.locbar b{color:var(--txt)}
.chip.lnk{display:inline-flex;align-items:center;gap:3px;text-decoration:none;cursor:pointer;background:var(--panel2);color:var(--primary);border:1px solid var(--line2)}
.chip.lnk:hover{background:var(--primary);color:#fff}
.searchbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.searchbar input,.searchbar select{flex:1;min-width:130px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ===== 命令面板 ⌘K ===== */
.cmdk-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);
  color:var(--muted);padding:7px 10px;border-radius:10px;font-size:13px;min-width:190px;transition:.15s}
.cmdk-btn:hover{border-color:var(--primary);color:var(--primary)}
.cmdk-btn .kbd{margin-left:auto;display:flex;gap:3px}
.kbd b{display:inline-block;min-width:18px;text-align:center;padding:1px 5px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--muted);font-size:11px;font-weight:600;font-family:inherit}
.cmdk-mask{position:fixed;inset:0;z-index:120;background:rgba(15,18,26,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.cmdk-mask.show{display:flex}
.cmdk{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;animation:cmdIn .16s ease-out}
@keyframes cmdIn{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.cmdk-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.cmdk-head svg{color:var(--muted);flex-shrink:0}
.cmdk-head input{flex:1;border:none;outline:none;background:transparent;color:var(--txt);font-size:16px}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-group{font-size:11px;font-weight:700;color:var(--muted2);padding:8px 10px 4px;letter-spacing:.4px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer}
.cmdk-item .ci{width:28px;height:28px;border-radius:8px;background:var(--panel2);color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmdk-item .cm{flex:1;min-width:0}
.cmdk-item .cm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-item .cm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-item .cg{font-size:11px;color:var(--muted2);flex-shrink:0}
.cmdk-item.on,.cmdk-item:hover{background:var(--panel2)}
.cmdk-item.on .ci{background:var(--primary);color:#fff}
.cmdk-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted2);flex-wrap:wrap}
.cmdk-empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}
mark{background:rgba(245,158,11,.32);color:inherit;border-radius:3px;padding:0 1px}
/* ===== 打卡热力图 ===== */
.heat{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);margin-top:7px}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* ===== 看板拖拽 ===== */
.kcard{cursor:grab}
.kcard.dragging{opacity:.4}
.kcol.dragover{background:var(--panel2);outline:2px dashed var(--primary);outline-offset:-3px;border-radius:12px}
/* ===== 新手引导 tour（v6） ===== */
.tour-mask{position:fixed;inset:0;z-index:200;background:rgba(15,18,26,.55);display:none}
.tour-mask.show{display:block}
.tour-highlight{position:relative;z-index:205 !important;box-shadow:0 0 0 4px var(--primary),0 12px 32px rgba(0,0,0,.38);border-radius:12px;outline:none}
.tour-card{position:fixed;z-index:206;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.32);padding:18px 18px 14px;animation:up .25s ease-out}
.tour-card .tc-art{width:120px;height:90px;margin:0 auto 4px;display:block}
.tour-card h4{margin:0 0 6px;font-size:15px;color:var(--txt)}
.tour-card p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:.2s}
.tour-dots i.on{background:var(--primary);width:18px;border-radius:4px}
.tour-foot{display:flex;gap:8px;align-items:center}
.tour-foot .skip{margin-right:auto;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:6px}
.tour-foot .skip:hover{color:var(--txt)}
/* 投递分布分析 tabs + 图表图例 */
.grp-tabs{display:inline-flex;gap:6px;margin-bottom:10px;background:var(--panel2);padding:4px;border-radius:10px}
.grp-tabs button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:7px;font-size:13px;cursor:pointer;transition:.15s}
.grp-tabs button.on{background:var(--primary);color:#fff}
.grp-chart{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lg-row{display:flex;flex-direction:column;gap:7px}
.lg{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt)}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
.kcol{transition:background .12s}
/* ===== 日程日历（新增核心视图） ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.cal-w{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.cal-cell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:4px;-webkit-tap-highlight-color:transparent}
.cal-cell:hover{border-color:var(--primary)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.cal-cell.sel{background:var(--panel2)}
.cal-cell.past{opacity:.5}
.cal-cell{position:relative}
.cal-cell.we{background:var(--panel2)}
.cal-cell.holi .cal-d{color:var(--red);font-weight:700}
.cal-flag{position:absolute;top:3px;right:4px;font-size:9px;line-height:13px;color:#fff;background:var(--red);border-radius:3px;padding:0 3px}
.cal-d{font-size:13px;font-weight:600;line-height:1}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cal-dots i{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.cal-more{font-size:10px;color:var(--muted2);font-weight:600}
.cal-legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal-dd{font-size:11px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
/* ===== 主题切换 ===== */
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel);color:var(--muted);transition:.15s}
.theme-btn:hover{color:var(--primary);border-color:var(--primary)}
/* mobile bottom nav */
.bottomnav{display:none}
@media(max-width:768px){

  .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);transition:transform .25s ease,box-shadow .25s ease;z-index:100;box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,.18)}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(15,18,26,.45);z-index:95;display:none;-webkit-tap-highlight-color:transparent}
  .sidebar-backdrop.show{display:block}
  .view{padding:14px}
  .cols-2{grid-template-columns:1fr}
  .cols-3,.cols-4{grid-template-columns:repeat(2,1fr)}

  .listrow{flex-wrap:wrap;row-gap:8px}
  .kanban{grid-template-columns:repeat(6,minmax(160px,1fr))}
  .topbar{padding:10px 14px}

  .btn{padding:11px 14px;min-height:44px}

  .iconbtn,.minibtn{min-width:40px;min-height:40px}
  input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font-size:16px;padding:11px 12px}
  .searchbar input,.searchbar select{min-width:100%}

  .today .item{flex-wrap:wrap}
  .today .item .meta{flex:1 1 100%;margin-bottom:6px}
  table{font-size:13px}

  .cmdk-list{max-height:60vh}

  /* 新手引导移动端：卡片贴底、全宽、按钮更大，避免被遮挡/出屏 */
  .tour-card{width:auto;left:14px !important;right:14px !important;bottom:calc(14px + env(safe-area-inset-bottom));top:auto !important;transform:none;max-width:none;animation:up .25s ease-out}
  .tour-card .tc-art{width:100px;height:75px}
  .tour-foot{flex-direction:column;gap:10px}
  .tour-foot button{width:100%;min-height:44px;justify-content:center}
  .tour-foot .skip{margin-right:0;width:100%;min-height:44px}
  /* 移动端顶部栏精简：隐藏次要文字与保存状态，避免拥挤换行 */
  .topbar .sub{display:none}
  .save-stat{display:none}
  /* 模态框底部按钮全宽、纵向排列，避免误触 */
  .modal .foot{flex-direction:column;gap:8px}
  .modal .foot .btn{width:100%;justify-content:center;min-height:44px}
  /* 面板内边距收紧 */
  .panel{padding:16px}
  /* 日历在窄屏：格子更密、圆点更小 */
  .cal-grid{gap:4px}
  .cal-cell{min-height:52px;padding:5px}
  .cal-d{font-size:12px}
  .cal-dots i{width:6px;height:6px}
}
/* [v3] 漏斗 / 快捷键 / 别名 样式 */
.funnel{margin-top:4px}
.funnel svg{background:var(--panel2);border-radius:10px;padding:6px 4px}
.kv{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.krow{display:flex;align-items:center;gap:12px}
.krow kbd{display:inline-block;min-width:96px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:5px 8px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
.krow span{color:var(--muted)}
.aliases{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.atag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.atag small{color:var(--muted);font-size:11px}
.xbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:none;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer}
.xbtn:hover{background:var(--red);color:#fff}

/* [v4] 保存状态指示 / 存储不可用横幅 / 通用小按钮 */
.save-stat{font-size:12px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;transition:color .25s}
.save-stat.pulse{color:var(--green)}
.storage-warn{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--red);color:#fff;padding:10px 14px;font-size:13px}
.storage-warn[hidden]{display:none}
.storage-warn #storageWarnMsg{flex:1;min-width:200px;line-height:1.4}
.storage-warn .btn.xs{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}
.storage-warn .btn.xs:hover{background:rgba(255,255,255,.34)}
.storage-warn .btn.xs.ghost{background:transparent}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
.btn.xs.ghost{background:transparent}
.btn.xs:hover{border-color:var(--primary)}
.draft-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-txt);padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:13px}
.draft-tip span{flex:1;min-width:160px;line-height:1.4}
/* 首页可点统计卡 + 联动动态流 */
.stat.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.stat.clickable:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 18px rgba(79,70,229,.14)}
.feed{display:flex;flex-direction:column;gap:2px}
.feed-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .12s}
.feed-row:hover{background:var(--panel2)}
.feed-ic{width:28px;height:28px;border-radius:8px;background:var(--panel2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.feed-label{flex:0 0 64px;font-size:12px;color:var(--muted)}
.feed-text{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-date{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv-row:last-child{border-bottom:none}
.kv-row .tag{flex:0 0 auto}
.kv-row>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mp-row{display:flex;align-items:center;gap:14px}
.mp-qr-sm{width:84px;height:84px;flex:0 0 auto;border-radius:10px;background:#fff;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mp-body{flex:1;min-width:0}
.mp-body h2{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:17px}
.mp-center{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.mp-qr-lg{width:min(280px,72vw);max-width:280px;border-radius:12px;background:#fff;padding:10px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.mp-intro{max-width:560px;font-size:13.5px;line-height:1.75;color:var(--txt2)}
.mp-intro p{margin:0 0 8px}
.mp-intro ul{margin:0 0 8px 18px;padding:0}
.mp-intro li{margin:4px 0}
@media (max-width:768px){
  .feed-label{flex-basis:54px}
  .feed-text{font-size:12.5px}
}
/* ===================== UI 优化（v6.12）：桌面 + 移动统一打磨 ===================== */
/* 自定义滚动条（webkit + firefox），与主题一致、低调 */
*{-ms-overflow-style:thin;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted2)}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{border-color:var(--panel)}
/* 键盘焦点可见性 */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline-offset:2px}
/* 文本选中色 */
::selection{background:rgba(79,70,229,.20);color:var(--txt)}
/* 背景层次：在纯色之上叠加极低透明度的双径向渐变，避免大块扁平 */
body{background-image:radial-gradient(1200px 620px at 82% -12%, rgba(79,70,229,.06), transparent 60%), radial-gradient(900px 520px at -8% 112%, rgba(124,58,237,.05), transparent 55%)}
html[data-theme="dark"] body{background-image:radial-gradient(1200px 620px at 82% -12%, rgba(109,100,245,.12), transparent 60%), radial-gradient(900px 520px at -8% 112%, rgba(167,139,250,.09), transparent 55%)}
/* 视图切换：进入时轻微上浮淡入 */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:viewIn .30s cubic-bezier(.22,.61,.36,1) both}
/* 卡片悬浮微交互（职位卡 / 行业卡） */
.job,.ind{transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease}
.job:hover,.ind:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(79,70,229,.13);border-color:var(--line2)}
/* 首页问候语（hero） */
.greet{background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.greet:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.10)}
.greet .gh{font-size:20px;font-weight:800;letter-spacing:.3px}
.greet .gs{font-size:13px;opacity:.92;margin-top:5px;max-width:680px;line-height:1.55}
.greet .gpin{position:absolute;right:18px;bottom:16px;font-size:12px;opacity:.85;
  background:rgba(255,255,255,.16);padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
/* 侧边栏导航分组标签 */
.nav-group-label{font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--muted2);
  padding:12px 12px 5px;text-transform:uppercase}
.nav a{position:relative;overflow:hidden}
.nav a.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#fff}
.nav a.active{font-weight:600}
/* 侧边栏品牌区细微渐变顶光 */
.brand{background:linear-gradient(180deg, rgba(79,70,229,.06), transparent 70%)}
.side-close{display:none;margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel);color:var(--muted);align-items:center;justify-content:center;flex-shrink:0}
.side-close:hover{color:var(--primary);border-color:var(--primary)}
/* 命令面板按钮更像搜索框 */
.cmdk-btn{box-shadow:0 1px 2px rgba(16,24,40,.04)}
/* 统计卡图标底色柔和化（覆盖原硬色块） */
.stat .ic{border-radius:10px}
/* 通用按钮在浅色面板上更克制 */
.btn{border-color:var(--line2)}
/* 移动端增强 */
@media (max-width:768px){
  .view{animation:viewIn .26s cubic-bezier(.22,.61,.36,1) both;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
  .side-foot{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  .side-close{display:inline-flex}
  .greet{padding:18px 16px;margin:0 0 14px}
  .greet .gpin{position:static;margin-top:12px}
  .nav a{font-size:15px;padding:12px 14px}
  .nav-group-label{padding:14px 14px 6px;font-size:11px}
  /* 首页统计卡：手机上 2 列紧凑，不再竖排占满 */
  .cols-5{grid-template-columns:repeat(2,1fr)}
  .stat .n{font-size:22px}
  /* 底部 Tab 常驻导航：核心入口一眼可见、一触即达，无需开抽屉 */
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;align-items:stretch;box-shadow:0 -4px 18px rgba(15,18,26,.08)}
  html[data-theme="dark"] .bottomnav{box-shadow:0 -4px 18px rgba(0,0,0,.4)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    flex:1 1 0;min-width:0;padding:6px 2px;border-radius:12px;color:var(--muted);
    font-size:11px;font-weight:600;text-decoration:none;line-height:1.1;
    -webkit-tap-highlight-color:transparent;transition:background .15s ease,color .15s ease}
  .bottomnav a svg{width:23px;height:23px;flex-shrink:0}
  .bottomnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottomnav a.active{color:var(--primary);background:rgba(79,70,229,.12)}
  .bottomnav a:active{transform:scale(.92)}
  .mp-row{gap:12px}
  .mp-qr-sm{width:72px;height:72px;padding:5px}
  .mp-body h2{font-size:15px}
}
/* ===== 打印 / 导出 PDF（原生 print，完美支持中文，零依赖） ===== */
.print-root{display:none}
@media print{
  @page{size:A4;margin:14mm}

  #printRoot .panel h2{font-size:14px;margin:0 0 10px}
  #printRoot .job,#printRoot .ind,#printRoot .stat,#printRoot .listrow,#printRoot .today,#printRoot .tl .ev,#printRoot .kcard,#printRoot .cal-cell,#printRoot .feed-row{break-inside:avoid;page-break-inside:avoid}
  #printRoot .stat .n{font-size:20px}
  #printRoot .greet{background:linear-gradient(135deg,#4f46e5,#7c3aed)!important;color:#fff!important;padding:14px 16px;margin:0 0 12px;border-radius:8px}
  #printRoot .greet .gpin,#printRoot .greet:before{display:none!important}
  #printRoot a{color:#1f2533;text-decoration:none}
  #printRoot button,#printRoot input,#printRoot select,#printRoot textarea,#printRoot .seg,#printRoot .row,#printRoot .cmdk-btn,#printRoot .searchbar,#printRoot .grp-tabs,#printRoot .provtab,#printRoot .heat-legend,#printRoot .cal-legend{display:none!important}
  #printRoot .kanban{overflow:visible}
  #printRoot .kcol{min-width:0}
  #printRoot .scrollx{overflow:visible}
}

function platBindRow(b){
  const o=PLAT_BIND_OPTS.find(function(p){return p.k===b.k;})||{name:b.k};
  return '<div class="bindrow" data-bid="'+b.id+'">'+
    '<div class="binf"><b>'+esc(o.name)+'</b>'+(b.account?' <span class="muted">· '+esc(b.account)+'</span>':'')+'</div>'+
    '<div class="bact">'+
      (b.apply?'<button class="minibtn" data-act="pbOpen" data-url="'+esc(b.apply)+'">申请页</button>':'')+
      (b.status?'<button class="minibtn" data-act="pbOpen" data-url="'+esc(b.status)+'">投递状态</button>':'')+
      '<button class="minibtn" data-act="pbEdit" data-id="'+b.id+'">编辑</button>'+
      '<button class="minibtn danger" data-act="pbDel" data-id="'+b.id+'">删除</button>'+
    '</div></div>';
}

  openModal('<h3>'+icon("link",18)+' 编辑 '+esc(o.name||b.k)+' 绑定</h3>'+
    '<div class="field"><label>账号 / 昵称（仅本地备注，便于识别）</label><input type="text" id="pbAccount" value="'+esc(b.account||"")+'" placeholder="如 138xxxx / 我的BOSS号"></div>'+

}

/* 探测存储可用性：无痕模式 / 内嵌框架 / 浏览器禁用存储时 setItem 会抛错 */
let STORAGE_OK=true;
let _dirty=false;            /* 内存有改动待落盘 */
let _saveTimer=null;
(function probeStorage(){
  try{
    const t="__wb_probe__";localStorage.setItem(t,"1");localStorage.removeItem(t);STORAGE_OK=true;
  }catch(e){STORAGE_OK=false;}
})();

function rawSave(){
  const str=JSON.stringify(S);
  localStorage.setItem(LS_KEY,str);
  try{localStorage.setItem(BAK_KEY,str);}catch(e){}   /* 留一份最近的好副本，损坏时可回退 */
}
/* 落盘：成功写主+备；失败（配额/禁用）不抛错、不改内存，并提示告警 */
function save(){
  if(!STORAGE_OK){updateSaveStat("存储不可用");showStorageWarn(true);return;}
  try{rawSave();_dirty=false;updateSaveStat("已自动保存");}
  catch(e){
    if(e&&(e.name==="QuotaExceededError"||e.code===22||e.code===1014)){
      STORAGE_OK=false;
      showStorageWarn(true,"本地存储空间已满，新数据可能无法保存，请点「导出备份」留存，或清理浏览器数据。");
    }
    updateSaveStat("保存失败");console.warn("save failed",e);
  }
}
/* 防丢兜底：任何内存改动后最多 1.5s 落盘；关闭/切后台前强制落盘 */
function markDirty(){_dirty=true;if(_saveTimer)clearTimeout(_saveTimer);_saveTimer=setTimeout(function(){if(_dirty)save();},1500);}
function flushSave(){if(_dirty&&STORAGE_OK){try{rawSave();_dirty=false;updateSaveStat("已自动保存");}catch(e){}}}

function load(){
  let raw=null,recovered=false;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){}
  if(raw){try{S=JSON.parse(raw);}catch(e){raw=null;}}          /* 主副本损坏 → 忽略，尝试备份 */
  if(!raw){try{const b=localStorage.getItem(BAK_KEY);if(b){S=JSON.parse(b);recovered=true;}}catch(e){}}
  if(!S||typeof S!=="object"||Array.isArray(S))S={};
  if(!S.profile)S.profile=Object.assign({},NEUTRAL_PROFILE);
  if(!S.platforms)S.platforms=DEFAULT_PLATFORMS.map(function(p){return Object.assign({},p);});
  else{ /* 老用户自动获得后续新增的默认平台（按 key 合并，保留自定义） */
    DEFAULT_PLATFORMS.forEach(function(dp){if(!S.platforms.some(function(p){return p.key===dp.key;}))S.platforms.push(Object.assign({},dp));});
  }
  if(!S.jobs)S.jobs=[];
  if(!S.resumes)S.resumes=[];
  if(!S.deliveries)S.deliveries=[];
  if(!S.platBinds)S.platBinds=[];
  if(!S.mail)S.mail={provider:"outlook",clientId:"",email:"",accessToken:"",refreshToken:"",expiresAt:0};
  if(!S.cnMail)S.cnMail={provider:"qq",account:"",authCode:"",smtpHost:"smtp.qq.com",smtpPort:465,smtpSsl:true};
  if(!S.settingsMailTab)S.settingsMailTab="";
  if(!S.location)S.location={granted:false,province:null,lat:null,lng:null,byGeo:false};
  if(S.examShowLocal===undefined)S.examShowLocal=true;
  if(!S.saved)S.saved=[];
  if(!S.plans)S.plans=[];
  if(!S.milestones)S.milestones=[];
  if(!S.finance)S.finance={tx:[],budget:{},assets:[],bills:[]};
  if(!S.health)S.health=[];
  if(!S.goals)S.goals=[];
  if(!S.skills)S.skills=[];
  if(!S.media)S.media=[];
  if(!S.relations)S.relations={contacts:[],events:[],interactions:[]};
  if(!S.life)S.life={wardrobe:[],recipes:[],shopping:[],trips:[],chores:[],outfits:[]};
  if(!S.notes)S.notes={notes:[],ideas:[]};
  if(!S.tools)S.tools={passwords:[],receipts:[],pomoLog:[]};
  if(!S.habits)S.habits=[];
  if(!S.finance.cats)S.finance.cats=["餐饮","交通","购物","居住","娱乐","医疗","工资","其他"];
  if(!S.finance.cBudgets)S.finance.cBudgets={};
  if(!S.finance.recurring)S.finance.recurring=[];
  if(!S.healthT)S.healthT={water:8,sleep:7.5,steps:8000,exercise:30};
  if(!S.meds)S.meds=[];
  if(!S.relations.star)S.relations.star={};
  if(S.seeded!==true){seed();}
  applyRecurring();

}

/* ---------- 算法 ---------- */
function parseResume(text){
  text=(text||"").normalize("NFKC");
  const EMAIL=/(^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})|([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g;
  const emails=text.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)||[];
  const phones=text.match(/(?<!\d)(1[3-9]\d{9})(?!\d)/g)||[];
  const DEGREE=/(博士|硕士|研究生|本科|大专|专科|高中|中专|技校)/g;
  const degrees=text.match(DEGREE)||[];
  // skills
  const found=[];
  SKILLS.forEach(function(s){
    if(/^[A-Za-z0-9\+#\.\-]+$/.test(s)){
      const re=new RegExp("(?<![A-Za-z0-9])"+s.replace(/[.+*?^$()[\]\\]/g,"\\$&")+"(?![A-Za-z0-9])","i");
      if(re.test(text))found.push(s);
    }else if(text.indexOf(s)>=0){found.push(s);}
  });
  // 区块自由技能
  const SKILL_HEAD=/(专业技能|核心技能|技能特长|技能与特长|个人技能|职业技能|熟悉软件|掌握工具|技能关键字|技能|Skills|SKILLS|Skill|熟悉|掌握|熟练掌握)/;
  const SECTION_STOP=/(教育|学历|学习|经历|项目|工作|实习|实践|自我评价|个人评价|获奖|荣誉|证书|资格|语言|期望|求职|意向|个人简介|概述|总结|自荐)/;
  const SKILL_STOP=new Set(["掌握","熟悉","熟练","了解","使用","运用","具备","良好","一定","较强","能力","经验","以上","等","及","与","和","并","通过","负责","参与","完成","进行","能够","可以","善于","乐于","具有","拥有","相关","熟练使用","熟练掌握","熟悉使用"]);
  const ENGLISH_STOP=new Set(["in","with","and","the","for","to","of","a","an","is","are","or","on","at","by","as","be","do","we","i","you","he","she","they","this","that","it","from","into","using","use","used","have","has","had","familiar","proficient","develop","developed","developing","experience","experiences","skill","skills","etc","such","like","also","can","will","our","their","his","her","not","but","if","so","about","than","then","these","those","was","were","been","being","am","knowledge"]);
  const FRAGMENT_NOISE=["框架","数据库","部署","架构","工具","进行","公司","负责","参与","内容","描述","说明","简介","方面","要求","相关","开发","设计","工作","项目","能力","经验","分析","处理","管理","维护","支持","提供","实现","完成","学习","研究","了解","掌握","运用","从事","擅长","包括","例如","其中","以及","并且","能够","可以","具有"];
  function splitLine(line){
    const toks=line.split(/[\s,，、;；/\\|（）()\[\]【】:：.。()]+/);const out=[];
    toks.forEach(function(t){
      t=t.trim().replace(/[。；;，,、]$/,"");if(!t)return;
      if(SKILL_STOP.has(t))return;
      if(/^[A-Za-z0-9\+#\.\-]+$/.test(t)){
        const tl=t.toLowerCase();
        if(ENGLISH_STOP.has(tl))return;
        if(t.length<2)return;
        if(!(/\d|[+#]/i.test(t)||/[A-Z]/.test(t[0])||t.length>=3))return;
        out.push(t);
      }else if(t.length>=2&&t.length<=10&&/[\u4e00-\u9fff]/.test(t)){
        if(FRAGMENT_NOISE.some(function(n){return t.indexOf(n)>=0;}))return;
        out.push(t);
      }
    });
    return out;
  }
  let capture=false;
  text.split("\n").forEach(function(line){
    const ls=line.trim();if(!ls)return;
    if(SKILL_HEAD.test(ls)&&!SECTION_STOP.test(ls)){
      capture=true;const tail=ls.replace(SKILL_HEAD,"").trim().replace(/^[：:，、；]+/,"");
      found.push.apply(found,splitLine(tail));return;
    }
    if(capture){if(SECTION_STOP.test(ls)){capture=false;return;}found.push.apply(found,splitLine(ls));}
  });
  // 去重
  const seen=new Set();const uniq=[];
  found.forEach(function(f){if(!seen.has(f)){seen.add(f);uniq.push(f);}});
  // major
  let major="";
  const ml=text.match(/(专业|所学专业|Major)\s*[:：]\s*([\u4e00-\u9fff]{2,12})/);
  if(ml)major=ml[2];
  if(!major){const mu=text.match(/(大学|学院)\s+([\u4e00-\u9fff]{2,12})\s+(本科|硕士|研究生|大专|专科)/);if(mu)major=mu[2];}
  if(!major){for(let i=0;i<MAJOR_KEYS.length;i++){if(text.indexOf(MAJOR_KEYS[i])>=0){major=MAJOR_KEYS[i];break;}}}
  // name
  let name="";
  const nm=text.match(/(姓名|Name)\s*[:：]\s*([\u4e00-\u9fff]{2,4})/);
  if(nm)name=nm[2];
  if(!name){
    const STOP=new Set(["简历","个人简历","求职简历","基本信息","个人资料","个人信息","联系方式","自我评价","个人简介","教育背景","工作经历","项目经历","技能","荣誉","证书","求职意向","专业技能","核心技能","个人技能","技能特长","技能与特长"]);
    const lines=text.split("\n").slice(0,6);
    for(let i=0;i<lines.length;i++){const ls=lines[i].trim();if(ls&&/^[\u4e00-\u9fff]{2,4}$/.test(ls)&&!STOP.has(ls)){name=ls;break;}}
  }
  const keywords=uniq.slice();
  degrees.forEach(function(d){if(keywords.indexOf(d)<0)keywords.push(d);});
  if(major&&keywords.indexOf(major)<0)keywords.push(major);
  return {name:name,email:emails[0]||"",phone:phones[0]||"",degrees:Array.from(new Set(degrees)),
    major:major,skills:uniq,keywords:keywords,text_len:text.length};
}

function localMatch(resumeParsed,profile,job){
  const kws=[];
  (resumeParsed.skills||[]).forEach(function(k){if(kws.indexOf(k)<0)kws.push(k);});
  (profile.keywords||"").split(",").forEach(function(k){k=k.trim();if(k&&kws.indexOf(k)<0)kws.push(k);});
  if(!kws.length)return {score:0,level:"低",matched:[],missing:[],reason:"简历无可用关键词"};
  const corpusL=new Set(kws.map(function(k){return k.toLowerCase();}));
  const jobBlob=(job.title+" "+job.company+" "+job.description+" "+job.city).toLowerCase();
  const matched=[],missing=[];
  kws.forEach(function(kw){
    const k=String(kw).toLowerCase();
    if(corpusL.has(k)&&jobBlob.indexOf(k)>=0)matched.push(kw);
    else if(jobBlob.indexOf(String(kw).toLowerCase())>=0)matched.push(kw);
    else if(corpusL.has(k)){if(jobBlob.indexOf(k)>=0)matched.push(kw);else missing.push(kw);}
    else missing.push(kw);
  });
  // 重新精确计算
  const matchedSet=new Set();
  kws.forEach(function(kw){
    if(jobBlob.indexOf(String(kw).toLowerCase())>=0)matchedSet.add(kw);
  });
  const matchedArr=Array.from(matchedSet);
  const missingArr=kws.filter(function(k){return matchedSet.has(k)===false;});
  const exact_cov=matchedArr.length/Math.max(1,kws.length);
  let resume_fields=new Set(),job_fields=new Set();
  FIELD_GROUPS.forEach(function(g){
    const terms=g[1];
    terms.forEach(function(t){if(corpusL.has(t))resume_fields.add(g[0]);if(jobBlob.indexOf(t)>=0)job_fields.add(g[0]);});
  });
  const field_matched=[];resume_fields.forEach(function(f){if(job_fields.has(f))field_matched.push(f);});
  const field_rel=resume_fields.size?field_matched.length/resume_fields.size:0;
  let score=exact_cov*50+field_rel*40;
  const core_hit=matchedArr.filter(function(k){return CORE_MAJOR.indexOf(k)>=0;});
  if(core_hit.length)score+=5;
  const title=job.title.toLowerCase();
  if(CORE_MAJOR.some(function(k){return title.indexOf(k.toLowerCase())>=0;}))score+=5;
  if(MAJOR_HINT.some(function(m){return jobBlob.indexOf(m.toLowerCase())>=0;}))score+=5;
  if(!resume_fields.size)score=exact_cov*80;
  score=Math.max(0,Math.min(100,Math.round(score)));
  let reason="精确命中 "+matchedArr.length+" 项";
  if(field_matched.length)reason+="；领域相关："+field_matched.slice(0,3).join("/");
  if(core_hit.length)reason+="；核心命中："+core_hit.slice(0,3).join("/");
  const level=score>=60?"高":(score>=30?"中":"低");
  return {score:score,level:level,matched:matchedArr,missing:missingArr.slice(0,12),reason:reason};
}
function detectPlan(goal){
  const g=(goal||"").toLowerCase();
  for(let i=0;i<PLANNER_DETECT.length;i++){const arr=PLANNER_DETECT[i][1];for(let j=0;j<arr.length;j++){if(g.indexOf(arr[j].toLowerCase())>=0)return PLANNER_DETECT[i][0];}}
  return "通用";
}
function smartPlan(goal,startDate,targetDate){
  goal=(goal||"").trim()||"我的目标";
  const today=new Date();
  let start=startDate?new Date(startDate):today;if(isNaN(start))start=today;
  let target=targetDate?new Date(targetDate):null;if(!target||target<=start)target=new Date(start.getTime()+60*86400000);
  const total=Math.max(1,Math.round((target-start)/86400000));
  const key=detectPlan(goal);const tpl=PLANNER_TEMPLATES[key];
  let title=goal;
  if(key!=="通用"){
    const base=tpl.title.replace("？","");
    title=(goal.indexOf(base)>=0||base.indexOf(goal)>=0)?base:(goal+" · "+base);
  }
  const tasks=[];
  tpl.phases.forEach(function(ph){
    const sDay=Math.floor(total*ph.pct[0]/100);
    const eDay=Math.max(sDay+1,Math.floor(total*ph.pct[1]/100));
    const n=ph.tasks.length;
    ph.tasks.forEach(function(t,i){
      let off=sDay+Math.floor((eDay-sDay)*(i+1)/Math.max(1,n));
      off=Math.min(Math.max(off,0),total);
      const due=new Date(start.getTime()+off*86400000);
      tasks.push({id:uid("t"),content:t,due_date:dateStr(due),done:0,done_at:null});
    });
  });
  return {title:title,goal:goal,smart:true,start_date:dateStr(start),target_date:dateStr(target),tasks:tasks};
}

function buildNav(){
  const nav=$("nav");
  const NAV_GROUPS=[
    {label:"总览",keys:["dashboard"]},
    {label:"职场学业",keys:["jobs","track","platforms","resumes","match","exams","disability","timeline","calendar","plans"]},
    {label:"目标成长",keys:["goals"]},
    {label:"财务",keys:["finance"]},
    {label:"健康",keys:["health"]},
    {label:"娱乐",keys:["media"]},
    {label:"关系",keys:["relations"]},
    {label:"衣食住行",keys:["life"]},
    {label:"记录灵感",keys:["notes"]},
    {label:"工具箱",keys:["tools"]},
    {label:"设置",keys:["settings"]}
  ];
  const byKey={};VIEWS.forEach(function(v){byKey[v.key]=v;});
  const BOTTOM_TABS=["dashboard","jobs","finance","health","settings"];
  let html="";
  NAV_GROUPS.forEach(function(g){
    html+='<div class="nav-group-label">'+g.label+'</div>';
    g.keys.forEach(function(k){
      const v=byKey[k];if(!v)return;
      const badge=navBadge(v.key);
      html+='<a data-act="nav" data-view="'+v.key+'" class="'+(v.key===curView?"active":"")+'">'+icon(v.icon)+'<span>'+v.name+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</a>';
    });
  });
  nav.innerHTML=html;
  const bn=$("bottomnav");
  if(bn){
    bn.innerHTML=BOTTOM_TABS.map(function(k){
      const v=byKey[k];if(!v)return "";
      return '<a data-act="nav" data-view="'+k+'" class="'+(k===curView?"active":"")+'" aria-label="'+v.name+'">'+icon(v.icon)+'<span>'+v.name+'</span></a>';
    }).join("");
  }
}

function toggleSidebar(){

/* 移动端：抽屉打开时左滑手势关闭，避免只能点遮罩 */
(function(){
  let sx=0,sy=0,on=false,t0=0;
  document.addEventListener("touchstart",function(e){
    const sb=$("sidebar");if(!sb||!sb.classList.contains("open")){on=false;return;}
    const t=e.touches[0];if(!t)return;sx=t.clientX;sy=t.clientY;on=true;t0=Date.now();
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!on)return;on=false;const t=e.changedTouches[0];if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(dx<-50&&Math.abs(dx)>Math.abs(dy)&&(Date.now()-t0)<700)closeSidebar();
  },{passive:true});
})();
function navBadge(key){
  if(key==="track"){
    const due=S.deliveries.filter(function(d){return d.follow_at&&daysBetween(todayStr(),d.follow_at)<=0&&(!d.done);}).length;
    return due||"";
  }
  if(key==="plans"){
    const due=planTasksDue().length;return due||"";
  }
  if(key==="calendar"){
    const up=calEvents().filter(function(e){const dd=daysBetween(todayStr(),e.date);return dd>=0&&dd<=7;}).length;
    return up||"";
  }
  return "";
}

/* ---------- 今天要处理 ---------- */
function planTasksDue(){
  const out=[];
  S.plans.forEach(function(p){
    (p.tasks||[]).forEach(function(t){
      if(!t.done&&t.due_date&&daysBetween(todayStr(),t.due_date)<=0){
        out.push({plan:p, task:t});
      }
    });
  });
  return out;
}
function followUps(){
  return S.deliveries.filter(function(d){return d.follow_at&&daysBetween(todayStr(),d.follow_at)<=0&&!d.done;});
}
/* 临近投递截止（≤3 天或已逾期）的投递，用于「今天要处理」与首页提醒 */
function deadlineReminders(){
  return S.deliveries.filter(function(d){return d.deadline&&!d.done;})
    .map(function(d){return {d:d,dd:daysBetween(todayStr(),d.deadline)};})
    .filter(function(o){return o.dd<=3;})
    .sort(function(a,b){return a.dd-b.dd;});
}
function nearMilestones(){
  return S.milestones.filter(function(m){if(m.done)return false;const d=daysBetween(todayStr(),m.date);return d>=0&&d<=7;})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}

  upcomingEvents(14).forEach(function(o){
    items.push('<div class="item"><span class="dot" style="background:'+(o.dd===0?'var(--red)':'var(--amber)')+'"></span>'+
      '<div class="meta"><b'+(o.dd===0?' style="color:var(--red)"':'')+'>'+(o.dd===0?'就是今天':'临近倒数日')+'：'+esc(o.e.title)+'</b><small>'+(o.dd===0?'是今天':'还有 '+o.dd+' 天')+' · '+esc(o.e.date)+'</small></div>'+

  });
  if(!items.length){
    items.push('<div class="empty">今天没有待处理事项，保持节奏，按计划推进即可。</div>');
  }
  return '<div class="today"><h2>'+icon("bell",16)+' 今天要处理</h2>'+items.join("")+'</div>';
}

function monthBalance(){
  var m=todayStr().slice(0,7),inc=0,exp=0;
  (S.finance.tx||[]).forEach(function(t){if(t.date&&t.date.slice(0,7)===m){if(t.type==="in")inc+=+t.amount;else exp+=+t.amount;}});
  return inc-exp;
}
function healthStreak(){
  var dates={};(S.health||[]).forEach(function(h){if(h.date)dates[h.date]=1;});
  var s=0,dd=new Date();
  while(dates[dateStr(dd)]){s++;dd.setDate(dd.getDate()-1);}
  return s;
}
function upcomingEvents(n){
  return (S.relations.events||[]).map(function(e){return {e:e,dd:daysUntil(e.date,e.type)};})
    .filter(function(o){return o.dd>=0&&o.dd<=n;}).sort(function(a,b){return a.dd-b.dd;});
}
function avgGoalProgress(){
  var gs=S.goals||[];if(!gs.length)return 0;
  var s=gs.reduce(function(a,g){return a+(+g.progress||0);},0);
  return Math.round(s/gs.length);
}

/* 日程日历：聚合备考节点 / 投递跟进 / 计划任务截止，跨模块一屏掌握 */
/* 2026 法定节假日（国务院办公厅 2025-11-04 公布），用于月历标记 */
const HOLIDAYS_2026=new Set();
(function(){
  const ranges=[["2026-01-01","2026-01-03"],["2026-02-15","2026-02-23"],["2026-04-04","2026-04-06"],["2026-05-01","2026-05-05"],["2026-06-19","2026-06-21"],["2026-09-25","2026-09-27"],["2026-10-01","2026-10-07"]];
  const p2=function(n){return String(n).padStart(2,"0");};
  ranges.forEach(function(r){
    const a=r[0].split("-"),b=r[1].split("-");
    let t=new Date(+a[0],+a[1]-1,+a[2]),e=new Date(+b[0],+b[1]-1,+b[2]);
    while(t<=e){HOLIDAYS_2026.add(t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate()));t=new Date(t.getTime()+86400000);}
  });
})();
const CAL_TYPE_LABEL={milestone:"节点",follow:"跟进",task:"任务"};
function calEvents(){
  const evs=[];
  S.milestones.forEach(function(m){if(!m.done&&m.date)evs.push({date:m.date,type:"milestone",title:m.title,sub:(m.track||"备考节点"),view:"timeline",id:m.id});});
  S.deliveries.forEach(function(d){if(!d.done&&d.follow_at)evs.push({date:d.follow_at,type:"follow",title:d.title,sub:(d.company||"待跟进"),view:"track",id:d.id});});
  S.deliveries.forEach(function(d){if(!d.done&&d.deadline)evs.push({date:d.deadline,type:"deadline",title:d.title,sub:(d.company||"")+" · 投递截止",view:"track",id:d.id});});
  S.plans.forEach(function(p){(p.tasks||[]).forEach(function(t){if(!t.done&&t.due_date)evs.push({date:t.due_date,type:"task",title:t.content,sub:("计划："+p.title),view:"plans",id:p.id});});});
  return evs;
}
/* 截止日 / 一般日程的倒计时文案（月历「未来 14 天」用） */
function calDueLabel(e){
  const dd=daysBetween(todayStr(),e.date);
  if(e.type==="deadline"){
    if(dd<0)return "已逾期 "+(-dd)+" 天";
    if(dd===0)return "今天截止";
    if(dd<=3)return dd+" 天后截止";
    return dd+" 天后";
  }
  if(dd<0)return (-dd)+" 天前";
  if(dd===0)return "今天";
  return dd+" 天后";
}
function renderCalendar(){
  const now=new Date();
  if(calY===null){calY=now.getFullYear();calM=now.getMonth();}
  const p2=function(n){return String(n).padStart(2,"0");};
  const first=new Date(calY,calM,1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(calY,calM+1,0).getDate();
  const evs=calEvents();
  const byDate={};
  evs.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const typeColor={milestone:"var(--primary)",follow:"var(--red)",task:"var(--green)",deadline:"var(--amber)"};
  const typeLabel={milestone:"节点",follow:"跟进",task:"任务",deadline:"截止"};
  const typeTag={milestone:"purple",follow:"red",task:"green",deadline:"amber"};
  let cells="";
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=calY+"-"+p2(calM+1)+"-"+p2(d);
    const dow=(startDow+d-1)%7;
    const isWe=dow===5||dow===6;
    const isToday=ds===todayStr();
    const isPast=daysBetween(todayStr(),ds)<0;
    const isHoli=HOLIDAYS_2026.has(ds);
    const list=byDate[ds]||[];
    const dots=list.slice(0,3).map(function(e){return '<i style="background:'+typeColor[e.type]+'"></i>';}).join("");
    const more=list.length>3?'<span class="cal-more">+'+(list.length-3)+'</span>':"";
    const flag=isHoli?'<span class="cal-flag">休</span>':"";
    cells+='<div class="cal-cell'+(isToday?" today":"")+(isPast?" past":"")+(calSel===ds?" sel":"")+(isWe?" we":"")+(isHoli?" holi":"")+'" data-act="calDay" data-date="'+ds+'"><div class="cal-d">'+d+'</div><div class="cal-dots">'+dots+more+'</div>'+flag+'</div>';

  const upcoming=evs.filter(function(e){const dd=daysBetween(todayStr(),e.date);return dd>=0&&dd<=14;}).sort(function(a,b){return a.date<b.date?-1:1;});
  const upHtml=upcoming.length?upcoming.map(function(e){return '<div class="listrow" data-act="goto" data-view="'+e.view+'"><div class="body"><b><span class="tag '+typeTag[e.type]+'">'+typeLabel[e.type]+'</span> '+esc(e.title)+'</b><small>'+e.date+' · '+esc(e.sub)+'</small></div><span class="cal-dd">'+calDueLabel(e)+'</span></div>';}).join(""):'<div class="empty tiny">未来两周没有排定的日程，去「时间线」「投递追踪」「计划打卡」补充节点吧。</div>';
  $("view").innerHTML=
    '<div class="panel" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
      '<button class="btn sm" data-act="calPrev" aria-label="上一月">'+icon("arrow",14)+'</button>'+
      '<div style="flex:1;text-align:center;font-weight:700;font-size:16px">'+calY+'年'+(calM+1)+'月</div>'+
      '<button class="btn sm" data-act="calNext" aria-label="下一月">'+icon("arrow",14)+'</button>'+
      '<button class="btn sm" data-act="calToday" style="margin-left:6px">今天</button>'+
    '</div>'+
    '<div class="cal-grid"><div class="cal-w">一</div><div class="cal-w">二</div><div class="cal-w">三</div><div class="cal-w">四</div><div class="cal-w">五</div><div class="cal-w">六</div><div class="cal-w">日</div>'+cells+'</div>'+
    '<div class="cal-legend">'+Object.keys(typeColor).map(function(k){return '<span><i style="background:'+typeColor[k]+'"></i>'+typeLabel[k]+'</span>';}).join("")+'</div>'+

async function mailEnsureToken(){

      const resp=await fetch(isGmail?GM_TOKEN:MS_TOKEN,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"client_id="+encodeURIComponent(S.mail.clientId)+"&grant_type=refresh_token&refresh_token="+encodeURIComponent(S.mail.refreshToken)+"&scope="+encodeURIComponent(isGmail?GM_SCOPES:MS_SCOPES)});
      const json=await resp.json();
      if(json.access_token){S.mail.accessToken=json.access_token;S.mail.refreshToken=json.refresh_token||S.mail.refreshToken;S.mail.expiresAt=Date.now()+(parseInt(json.expires_in||3600,10)*1000);save();return true;}
    }catch(e){}
  }
  return false;
}

/* ---------- Gmail 通道（Gmail API，零外链纯 fetch，对称于 Graph） ---------- */
function mimeSubject(s){const b=b64urlStr(s);return "=?UTF-8?B?"+b+"?=";}
function buildRfc822(subject,body,to,fromR,att){
  const boundary="xkbound_"+Date.now();const CRLF="\r\n";
  let raw="From: "+fromR+CRLF+"To: "+to+CRLF+"Subject: "+mimeSubject(subject)+CRLF+"Date: "+new Date().toUTCString()+CRLF+
    "MIME-Version: 1.0"+CRLF+"Content-Type: multipart/mixed; boundary="+boundary+CRLF+CRLF;
  raw+="--"+boundary+CRLF+"Content-Type: text/plain; charset=UTF-8"+CRLF+"Content-Transfer-Encoding: base64"+CRLF+CRLF;
  raw+=b64urlStr(body)+CRLF;
  if(att&&att.dataUrl){const i=att.dataUrl.indexOf(",");const bin=att.dataUrl.slice(i+1);
    raw+="--"+boundary+CRLF+"Content-Type: "+(att.mime||"application/octet-stream")+CRLF+"Content-Transfer-Encoding: base64"+CRLF+
      "Content-Disposition: attachment; filename=\""+(att.filename||att.name||"resume")+"\""+CRLF+CRLF;
    const wrapped=bin.replace(/(.{76})/g,"$1\r\n");raw+=wrapped+CRLF;}
  raw+="--"+boundary+"--"+CRLF;
  return raw;
}

/* ---------- 国内邮箱发送：生成完整 .eml 邮件文件（含简历附件），本地客户端打开即发 ---------- */
function downloadEml(filename,content){
  try{
    const blob=new Blob([content],{type:"message/rfc822"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){}},600);
    return true;
  }catch(e){toast("eml 生成失败："+e.message);return false;}
}

/* ---------- 反馈归集：自动（绑定邮箱收件箱）+ 手动（任意邮箱粘贴） ---------- */
const FB_LABEL={interview:"面试邀约",test:"笔试/测评",offer:"录用通知",reject:"未通过",pending:"待跟进"};
const FB_COLOR={interview:"#22c55e",test:"#3b82f6",offer:"#8b5cf6",reject:"#ef4444",pending:"#f59e0b"};
function detectFeedback(text){
  const t=String(text||"").toLowerCase();
  if(/录用|offer|恭喜|拟录用|入职|欢迎加入|聘任/.test(t))return "offer";
  if(/面试|邀约|相约|面谈|初面|复试|终面|视频面试|线下面试/.test(t))return "interview";
  if(/笔试|测评|测验|线上测试|机考|做题/.test(t))return "test";
  if(/很遗憾|未通过|不合适|落选|未能进入|感谢您的关注|感谢您投递|暂不|婉拒|未能通过|很抱歉/.test(t))return "reject";
  return "pending";
}
/* ========== 投递状态页解析（BOSS / 智联 / 51job / 猎聘等） ==========
   用户把平台「投递状态页」的文本或网页源码粘贴进来，自动剥离 HTML，
   按公司 / 职位名匹配本地投递记录，并在匹配片段附近识别平台状态词
   （已读 / 面试中 / 不合适 等），预览后一键标注回本地记录。 */
const WEB_STATUS_RULES=[
  {re:/不合适|不匹配|未通过筛选|不予考虑|暂不安排|未能进入下一轮|很遗憾|婉拒|落选|淘汰|恕不|未通过|没通过|已结束/i,label:"不合适",fb:"reject"},
  {re:/面试中|安排面试|已约面试|邀您面试|邀约面试|线下面试|视频面试|复试通知|终面|一面通知|二面|初面|待面试/i,label:"面试中",fb:"interview"},
  {re:/笔试|测评|测验|线上测试|机考|做题|笔试通知/i,label:"笔试/测评",fb:"test"},
  {re:/录用|拟录用|入职|欢迎加入|聘任|offer/i,label:"录用",fb:"offer"},
  {re:/已读|已查看|被查看|已读未回复|hr看|boss看|看过|已查阅/i,label:"已读",fb:"viewed"},
  {re:/待沟通|可沟通|沟通中|等待沟通/i,label:"待沟通",fb:"pending"},
  {re:/投递成功|已投递|已发送|投递完成|已申请/i,label:"已投递",fb:"applied"}
];
function detectStatusVocab(text){
  for(let i=0;i<WEB_STATUS_RULES.length;i++){if(WEB_STATUS_RULES[i].re.test(text))return {label:WEB_STATUS_RULES[i].label,fb:WEB_STATUS_RULES[i].fb};}
  return {label:"",fb:""};
}
function stripHtml(s){return String(s||"").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/\s+/g," ");}
/* 解析状态页：返回 [{id,title,company,status:{label,fb}}]（仅匹配到本地记录的） */
function parseStatusPage(raw){
  const text=stripHtml(raw);
  const out=[];
  S.deliveries.forEach(function(d){
    if(d.done)return;
    const keys=[d.company,d.title].filter(function(k){return k&&k.trim();}).map(function(k){return k.trim();});
    if(!keys.length)return;
    let idx=-1,bestKey="";
    keys.forEach(function(k){const i=text.indexOf(k);if(i>=0&&(idx<0||i<idx)){idx=i;bestKey=k;}});
    if(idx<0)return;
    const start=Math.max(0,idx-50),end=Math.min(text.length,idx+bestKey.length+120);
    const win=text.slice(start,end);
    const st=detectStatusVocab(win);
    if(!st.label)return;
    out.push({id:d.id,title:d.title,company:d.company,status:st});
  });
  return out;
}

}

    segs+='<path d="M32 32 L'+x0+' '+y0+' A26 26 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+STATUS_COLOR[s]+'"/>';
  });

}

/* [v2] 看板拖拽换状态（PC；移动端仍用 ◀▶ 按钮） */
function bindKanbanDnD(){
  let draggingId=null;
  Array.prototype.forEach.call(document.querySelectorAll(".kcard[data-jid]"),function(card){
    card.addEventListener("dragstart",function(e){
      draggingId=card.getAttribute("data-jid");
      card.classList.add("dragging");
      try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggingId);}catch(err){}
    });
    card.addEventListener("dragend",function(){card.classList.remove("dragging");draggingId=null;
      Array.prototype.forEach.call(document.querySelectorAll(".kcol"),function(c){c.classList.remove("dragover");});});
  });
  Array.prototype.forEach.call(document.querySelectorAll(".kcol[data-status]"),function(col){
    col.addEventListener("dragover",function(e){e.preventDefault();try{e.dataTransfer.dropEffect="move";}catch(err){}col.classList.add("dragover");});
    col.addEventListener("dragleave",function(){col.classList.remove("dragover");});
    col.addEventListener("drop",function(e){
      e.preventDefault();col.classList.remove("dragover");
      let jid=draggingId;
      try{jid=e.dataTransfer.getData("text/plain")||draggingId;}catch(err){}
      if(!jid)return;
      const st=col.getAttribute("data-status");
      const j=getJob(jid);
      if(j&&j.status!==st){j.status=st;save();renderTrack();toast("已移动到「"+STATUS_LABELS[st]+"」");}
    });
  });
}

/* ---------- 计划打卡 ---------- */
function planStreak(p){
  const s=new Set((p.checkins||[]).map(function(c){return c.date;}));
  if(!s.size)return 0;
  const t=new Date();
  function f(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  let cur;
  if(s.has(f(t)))cur=t;
  else if(s.has(f(new Date(t.getTime()-86400000))))cur=new Date(t.getTime()-86400000);
  else return 0;
  let n=0;
  while(s.has(f(cur))){n++;cur=new Date(cur.getTime()-86400000);}
  return n;
}
function planCard(p){
  const tasks=p.tasks||[];const done=tasks.filter(function(t){return t.done;}).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const streak=planStreak(p);
  const checkedToday=(p.checkins||[]).some(function(c){return c.date===todayStr();});
  const taskHtml=tasks.map(function(t){
    const over=t.due_date&&!t.done&&daysBetween(todayStr(),t.due_date)<0;
    return '<div class="listrow" style="padding:7px 0"><label class="iconbtn" style="cursor:pointer;'+(t.done?"background:var(--ok-bg);border-color:var(--green)":"")+'">'+
      '<input type="checkbox" '+(t.done?"checked":"")+' data-act="toggleTask" data-pid="'+p.id+'" data-tid="'+t.id+'" style="accent-color:var(--green)"></label>'+
      '<div class="body"><b style="'+(t.done?"text-decoration:line-through;color:var(--muted)":"")+'">'+esc(t.content)+'</b>'+
      '<small class="'+(over?"tag red":"")+'">'+(t.due_date||"无期限")+(over?" · 逾期":(t.done?" · 已完成":" · 待办"))+'</small></div>'+
      '<button class="minibtn" data-act="delTask" data-pid="'+p.id+'" data-tid="'+t.id+'">删除</button></div>';
  }).join("");
  return '<div class="panel"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
    '<div class="ring">'+ring(pct)+'</div>'+
    '<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(p.title)+'</div>'+
    '<div class="tiny muted">'+esc(p.goal||"")+' · '+done+'/'+tasks.length+' 任务 · 连续打卡 '+streak+' 天</div></div>'+
    (checkedToday?'<span class="tag green">今日已打卡</span>':'<button class="btn sm primary" data-act="checkin" data-pid="'+p.id+'">'+icon("check")+' 今日打卡</button>')+
    '<button class="iconbtn" data-act="delPlan" data-pid="'+p.id+'" title="删除计划">'+icon("trash")+'</button></div>'+
    '<details><summary class="tiny muted" style="cursor:pointer;margin-bottom:6px">查看 / 管理任务（'+tasks.length+'）</summary>'+taskHtml+
    '<div style="margin-top:8px;display:flex;gap:8px"><input type="text" id="newTask_'+p.id+'" placeholder="添加任务…" style="padding:7px 10px;font-size:13px"><button class="btn sm" data-act="addTask" data-pid="'+p.id+'">添加</button></div></details></div>';
}

/* ---------- 通用动作 ---------- */
function exportData(){
  const data=JSON.parse(JSON.stringify(S));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="小K工作台-备份-"+todayStr()+".json";a.click();
  localStorage.setItem("wb_xk_backup_ack",String(myRecordCount()));
  updateBackupTip();
  toast("已导出 JSON 备份");
}
function importData(file){
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);if(!d||typeof d!=="object")throw 0;
      S=Object.assign({profile:Object.assign({},NEUTRAL_PROFILE),platforms:DEFAULT_PLATFORMS.map(function(p){return Object.assign({},p);}),
        jobs:[],resumes:[],deliveries:[],saved:[],plans:[],milestones:[],mail:{provider:"outlook",clientId:"",email:"",accessToken:"",refreshToken:"",expiresAt:0},cnMail:null,platBinds:[]},d);
      S.seeded=true;save();buildNav();go(curView);toast("导入成功");
    }catch(e){toast("导入失败：文件格式不正确");}
  };
  r.readAsText(file);
}
function clearMine(){
  if(!confirm("确定清空我的数据（简历 / 收藏 / 投递 / 计划）？此操作不可恢复。"))return;
  S.resumes=[];S.deliveries=[];S.saved=[];S.plans=[];S._demoPlanted=false;save();go(curView);toast("已清空我的数据");
}
function clearDemo(){
  if(!confirm("确定清空示例数据（示例简历 / 示例计划 / 示例投递）？你自己录入的数据不会受影响。"))return;
  S.plans=S.plans.filter(function(p){return !p._demo;});

function toast(msg){
  let t=$("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2533;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;max-width:80%";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity="0";},1800);
}

function handleClick(e){

    case "closeCmdk":closeCmdk();break;
    case "cycleTheme":cycleTheme();break;

    case "nav":go(el.getAttribute("data-view"));break;

    case "startOAuth":startOAuth();break;
    case "mailUnbind":{S.mail.accessToken="";S.mail.refreshToken="";S.mail.email="";S.mail.expiresAt=0;save();renderSettings();toast("已解绑邮箱");}break;
    case "saveCnMail":{const t=isOAuthProvider(activeMailTab())?(S.cnMail?S.cnMail.provider:"qq"):activeMailTab();const ac=$("cnAccount")?$("cnAccount").value.trim():"";const code=$("cnCode")?$("cnCode").value.trim():"";if(!ac){toast("请填写邮箱账号");return;}if(!code){toast("请填写授权码");return;}const o=CN_MAIL_OPTS.find(function(x){return x.k===t;})||CN_MAIL_OPTS[0];S.cnMail={provider:t,account:ac,authCode:code,smtpHost:o.smtp,smtpPort:o.port,smtpSsl:o.ssl};save();renderSettings();toast("已绑定 "+o.name+"："+ac);}break;

    case "mailTab":{const tab=el.getAttribute("data-tab")||"outlook";S.settingsMailTab=tab;if(isOAuthProvider(tab)){if(S.mail.provider!==tab){S.mail.accessToken="";S.mail.refreshToken="";S.mail.email="";S.mail.expiresAt=0;}S.mail.provider=tab;}else{S.cnMail.provider=tab;}save();renderSettings();}break;

function getDeliv(id){return S.deliveries.find(function(d){return d.id===id;});}
function getPlan(id){return S.plans.find(function(p){return p.id===id;});}
function getMs(id){return S.milestones.find(function(m){return m.id===id;});}
function exportPdf(){
  const v=$("view");if(!v)return;
  const root=$("printRoot");if(!root)return;
  const t=($("viewTitle")?$("viewTitle").textContent:"小K万能工作台")||"小K万能工作台";
  root.innerHTML='<div class="pr-head"><div class="pr-t">'+esc(t)+'</div><div class="pr-s">由「小K万能工作台」生成 · '+todayStr()+'</div></div><div class="pr-body">'+v.innerHTML+'</div>';
  try{window.print();}catch(e){toast("当前环境不支持打印，请用普通浏览器打开");}
}
function handleChange(e){
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.getAttribute("data-act");const id=el.getAttribute("data-id")||el.getAttribute("data-pid");
  if(act==="selJob"){if(el.checked)jobSelected.add(id);else jobSelected.delete(id);const b=$("batchBtn");if(b)b.style.display=jobSelected.size?"":"none";const c=$("selCount");if(c)c.textContent=jobSelected.size;}
  else if(act==="statusJob"){const j=getJob(id);if(j){j.status=el.value;save();renderJobs();}}
  else if(act==="toggleTask"){const p=getPlan(id);if(p){const t=(p.tasks||[]).find(function(x){return x.id===el.getAttribute("data-tid");});if(t){t.done=el.checked?1:0;t.done_at=el.checked?todayStr():null;save();renderPlans();}}}
}

/* ============================================================
   [v2] 主题系统：浅色 / 深色 / 跟随系统
   ============================================================ */
const THEME_KEY="wb_xk_theme";
const THEME_ORDER=["auto","light","dark"];
const THEME_LABEL={auto:"跟随系统",light:"浅色",dark:"深色"};
function getTheme(){try{return localStorage.getItem(THEME_KEY)||"auto";}catch(e){return "auto";}}
function systemDark(){try{return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);}catch(e){return false;}}
function applyTheme(){
  const t=getTheme();
  const dark=(t==="dark")||(t==="auto"&&systemDark());
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",dark?"#12161f":"#4f46e5");
  const btn=$("themeBtn");
  if(btn){btn.innerHTML=icon(t==="auto"?"auto":(t==="dark"?"moon":"sun"),17);btn.setAttribute("title","主题："+THEME_LABEL[t]+"（点击切换）");}
}
function cycleTheme(){
  const next=THEME_ORDER[(THEME_ORDER.indexOf(getTheme())+1)%THEME_ORDER.length];
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  applyTheme();toast("主题已切换："+THEME_LABEL[next]);
}

let cmdkItems=[],cmdkIdx=0,cmdkOpen=false;
function pyHit(q,item){
  const hay=((item.t||"")+" "+(item.s||"")+" "+(item.py||"")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function hl(text,q){
  if(!q)return esc(text);
  const s=String(text==null?"":text);const i=s.toLowerCase().indexOf(q);
  if(i<0)return esc(s);
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));
}
function buildCmdkData(q){
  const out=[];
  VIEWS.forEach(function(v){
    const it={g:"页面",t:v.name,s:(TITLES[v.key]||["",""])[1]||"",ic:v.icon,py:VIEW_PY[v.key]||"",run:function(){go(v.key);}};
    if(!q||pyHit(q,it))out.push(it);
  });
  CMD_ACTIONS.forEach(function(a){
    const it={g:"操作",t:a.t,s:a.s,ic:a.ic,py:a.py,run:a.run};
    if(!q||pyHit(q,it))out.push(it);
  });
  aliasItems(q).forEach(function(a){out.push(a);});
  if(q){
    S.jobs.forEach(function(j){
      const it={g:"职位",t:j.title,s:(j.company||"")+" · "+(j.city||"")+" · "+(STATUS_LABELS[j.status]||""),ic:"board",py:"",run:function(){go("jobs");}};
      if(pyHit(q,it))out.push(it);

      const done=(p.tasks||[]).filter(function(t){return t.done;}).length;
      const it={g:"计划",t:p.title,s:"进度 "+done+"/"+((p.tasks||[]).length)+" · 目标 "+(p.goal||"-"),ic:"plan",py:"",run:function(){go("plans");}};
      if(pyHit(q,it))out.push(it);
    });
    S.deliveries.forEach(function(d){
      const it={g:"投递",t:d.title,s:(d.company||"")+" · "+(d.created_at||""),ic:"send",py:"",run:function(){go("track");}};

      const it={g:"时间线",t:m.title,s:(m.track||"")+" · "+(m.date||""),ic:"cal",py:"",run:function(){go("timeline");}};
      if(pyHit(q,it))out.push(it);

    (S.platforms||[]).forEach(function(p){

      if(pyHit(q,it))out.push(it);
    });
  }
  return out.slice(0,40);
}
function renderCmdk(){

function checkinMap(){
  const map={};

    (p.checkins||[]).forEach(function(c){if(c&&c.date)map[c.date]=(map[c.date]||0)+1;});
    (p.tasks||[]).forEach(function(t){if(t.done&&t.done_at)map[t.done_at]=(map[t.done_at]||0)+1;});
  });
  return map;
}
function heatmap(weeks){
  weeks=weeks||16;
  const map=checkinMap();
  const cell=13,gap=3,pad=18;

/* 周报导出图片（v6）：纯 canvas 手绘，不引外部库，高 DPI 清晰 */
function buildWeeklyCanvas(txt){
  const DPR=2,W=820,pad=44,lh=28,fs=16.5;
  const lines=(txt||"").split("\n");
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  ctx.font=fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
  const wrapped=[];
  lines.forEach(function(ln){
    if(ln===""){wrapped.push("");return;}
    let cur="";
    for(let i=0;i<ln.length;i++){
      const ch=ln[i];
      if(ctx.measureText(cur+ch).width>W-pad*2){wrapped.push(cur);cur=ch;}
      else cur+=ch;
    }
    wrapped.push(cur);
  });
  const titleH=72,brandH=52;
  const H=titleH+pad+wrapped.length*lh+brandH;
  cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#f5f8ff");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#4f46e5";ctx.fillRect(0,0,W,8);
  ctx.fillStyle="#1e293b";ctx.font='bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("本周复盘周报",pad,46);
  ctx.fillStyle="#6366f1";ctx.fillRect(pad,56,W-pad*2,3);
  ctx.font=fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
  let y=titleH+pad;
  wrapped.forEach(function(ln){
    if(ln===""){y+=lh*0.5;return;}
    const head=/^[一二三四]、/.test(ln)||/转化漏斗/.test(ln);
    ctx.fillStyle=head?"#4f46e5":"#334155";
    ctx.font=(head?"bold ":"")+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(ln,pad,y);y+=lh;
  });
  ctx.fillStyle="#94a3b8";ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText("小K万能工作台 · 本地求职备考 · 数据仅存本机",pad,H-brandH/2+4);
  return cv.toDataURL("image/png");
}

/* CSV 解析：支持引号包裹、字段内逗号、制表符、换行 */
function parseCSV(text){
  text=String(text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const rows=[];let row=[],field="",q=false,i=0;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else{q=false;}}
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===","){row.push(field);field="";}
      else if(c==="\t"){row.push(field);field="";}
      else if(c==="\n"){row.push(field);rows.push(row);row=[];field="";}
      else field+=c;
    }
    i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});
}
/* 从解析出的二维数组导入职位：自动识别表头、按列映射、去重 */

  let cols={title:0,company:1,city:2,salary:3,url:4,company_email:6,description:7};
  if(hasHeader){
    const idxOf=function(names){for(let n=0;n<first.length;n++){if(names.some(function(h){return first[n].indexOf(h)>=0;}))return n;}return -1;};
    Object.keys(cols).forEach(function(k){const x=idxOf(HEAD[k]);if(x>=0)cols[k]=x;});

/* 任意格式简历读取：文本类读文本；图片压缩到 800px；其余读 base64 暂存 */
function humanSize(n){n=Number(n)||0;if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";return (n/1024/1024).toFixed(1)+" MB";}
function isTextExt(ext){return ["txt","md","markdown","csv","json","log","text","yml","yaml","rtf","html","htm","xml","tex","org","doc","docx"].indexOf(ext)>=0;}
function compressImage(dataUrl,name,cb){
  try{
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;const MAX=800;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{cb(c.toDataURL("image/jpeg",0.85),w,h);}catch(e){cb(dataUrl,w,h);}
    };
    img.onerror=function(){cb(dataUrl);};
    img.src=dataUrl;
  }catch(e){cb(dataUrl);}
}
function readFileSmart(file,cb){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const isImg=/^image\//.test(file.type);
  if(isImg){
    const fr=new FileReader();
    fr.onload=function(){compressImage(fr.result,file.name,function(out,w,h){cb({name:file.name,mime:file.type||"image",ext:ext,dataUrl:out,size:out.length,isBinary:true,isImage:true,w:w,h:h});});};
    fr.onerror=function(){cb({error:true});};
    fr.readAsDataURL(file);
  }else if(isTextExt(ext)||/^text\//.test(file.type)||!file.type){
    const fr=new FileReader();
    fr.onload=function(){cb({name:file.name,text:String(fr.result||""),at:Date.now()});};
    fr.onerror=function(){cb({error:true});};
    fr.readAsText(file);
